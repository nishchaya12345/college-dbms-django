{% extends 'dbms_app/base.html' %}
{% block title %}Edit {{ student.name }} - College DBMS{% endblock %}
{% block content %}
<h1>Edit Student</h1>
<p class="subtitle">Saving triggers the AFTER-UPDATE handler, which closes the old history record and writes a new one.</p>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" value="{{ student.name }}" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ student.email }}" required>
            </div>
            <div>
                <label for="age">Age</label>
                <input type="number" id="age" name="age" value="{{ student.age }}" required>
            </div>
            <div>
                <label for="gpa">GPA</label>
                <input type="number" id="gpa" name="gpa" step="0.01" min="0" max="4" value="{{ student.gpa }}" required>
            </div>
        </div>
        <button type="submit">Save Changes</button>
        <a class="btn" style="background:#8a8f98;" href="{% url 'page-students' %}">Cancel</a>
    </form>
</div>
{% endblock %}
