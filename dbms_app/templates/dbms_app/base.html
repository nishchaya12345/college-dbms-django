<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}College DBMS{% endblock %}</title>
    <style>
        :root {
            --primary: #2c5f8a;
            --primary-dark: #1e435f;
            --bg: #f4f6f8;
            --card: #ffffff;
            --border: #dfe4ea;
            --text: #222;
            --muted: #6b7280;
            --danger: #c0392b;
            --success: #1e7e34;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
        }
        nav {
            background: var(--primary-dark);
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            height: 56px;
        }
        nav .brand {
            color: white;
            font-weight: 700;
            margin-right: 2rem;
            font-size: 1.1rem;
        }
        nav a {
            color: #dce8f2;
            text-decoration: none;
            margin-right: 1.2rem;
            font-size: 0.92rem;
        }
        nav a:hover { color: white; }
        .actions { display:flex; gap:.4rem; flex-wrap:wrap; }
        .error { background:#fdeaea; color:var(--danger); padding:.6rem .9rem; border-radius:6px; margin-bottom:.5rem; }
        @media (max-width: 800px) {
            nav { height:auto; padding:.8rem 1rem; flex-wrap:wrap; gap:.55rem; }
            nav .brand { width:100%; margin-right:0; }
            nav a { margin-right:.6rem; }
            .container { margin:1rem auto; }
            table { display:block; overflow-x:auto; white-space:nowrap; }
        }
        .container {
            max-width: 980px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
        .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h2 { font-size: 1.05rem; margin-top: 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }
        th, td {
            text-align: left;
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--muted); font-weight: 600; font-size: 0.82rem; text-transform: uppercase; }
        tr:hover td { background: #fafbfc; }
        form.inline { display: inline; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        label { font-size: 0.82rem; color: var(--muted); display: block; margin-bottom: 0.2rem; }
        input, select {
            width: 100%;
            padding: 0.45rem 0.55rem;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 0.92rem;
        }
        button, .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.45rem 0.95rem;
            border-radius: 5px;
            font-size: 0.88rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .btn:hover { background: var(--primary-dark); }
        button.danger, .btn.danger { background: var(--danger); }
        button.danger:hover { background: #922b21; }
        button.small, .btn.small { padding: 0.28rem 0.6rem; font-size: 0.8rem; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge.insert { background: #e3f6e8; color: var(--success); }
        .badge.update { background: #fff4e0; color: #9a6a00; }
        .badge.delete { background: #fdeaea; color: var(--danger); }
        .empty { color: var(--muted); font-style: italic; padding: 0.75rem 0; }
        .messages { margin-bottom: 1rem; }
        .messages .msg {
            background: #e3f6e8;
            color: var(--success);
            padding: 0.6rem 0.9rem;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .stat-row { display: flex; gap: 1rem; flex-wrap: wrap; }
        .stat {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1.1rem;
            min-width: 120px;
        }
        .stat .num { font-size: 1.4rem; font-weight: 700; color: var(--primary-dark); }
        .stat .label { font-size: 0.78rem; color: var(--muted); }
    </style>
</head>
<body>
    <nav>
        <span class="brand">🗄️ College DBMS</span>
        <a href="{% url 'page-home' %}">Dashboard</a>
        <a href="{% url 'page-students' %}">Students</a>
        <a href="{% url 'page-courses' %}">Courses</a>
        <a href="{% url 'page-enrollments' %}">Enrollments</a>
        <a href="{% url 'page-procedures' %}">Procedures</a>
        <a href="{% url 'page-views' %}">Views</a>
        <a href="{% url 'page-indexes' %}">Indexes</a>
    </nav>
    <div class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="msg">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
